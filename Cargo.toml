[package]
name = "swc-plugin-react-source-string"
version = "0.4.0"
edition = "2021"
description = "SWC plugin that adds data-source attributes to JSX elements (React/UI components and HTML elements) for debugging"

[lib]
crate-type = ["cdylib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(swc_ast_unknown)"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swc_core = { version = "=57.0.0", features = ["common", "ecma_utils", "ecma_plugin_transform"] }
